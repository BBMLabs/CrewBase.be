name: rowingclub

networks:
  rowingclub-network:
    driver: bridge

volumes:
  rowingclub-postgres-data:
  rowingclub-redis-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    env_file:
      - ../../.env.developer

    environment:
      POSTGRES_DB: "${POSTGRES_DATABASE_NAME}"
      POSTGRES_USER: "${POSTGRES_USERNAME}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    volumes:
      - rowingclub-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USERNAME}" -d "$${POSTGRES_DATABASE_NAME}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - rowingclub-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    env_file:
      - ../../.env.developer

    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"

    volumes:
      - rowingclub-redis-data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - rowingclub-network

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile

    restart: unless-stopped

    env_file:
      - ../../.env.developer

    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENV:-Production}"
      ASPNETCORE_URLS: "http://+:8080"

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      ConnectionStrings__DefaultConnection: >-
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DATABASE_NAME};
        Username=${POSTGRES_USERNAME};
        Password=${POSTGRES_PASSWORD}

      FieldEncryption__CurrentKey: "${FIELD_ENCRYPTION_KEY_CURRENT}"
      FieldEncryption__PreviousKey: "${FIELD_ENCRYPTION_KEY_PREVIOUS}"
      FieldEncryption__CurrentKeyVersion: "${FIELD_ENCRYPTION_KEY_VERSION:-1}"

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - rowingclub-network
