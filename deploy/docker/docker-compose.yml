# =============================================================================
# RowingClub (CrewBase.be) - Docker Compose
# =============================================================================

name: rowingclub

networks:
  rowingclub-network:
    driver: bridge

volumes:
  rowingclub-postgres-data:
  rowingclub-redis-data:
  rowingclub-prometheus-data:
  rowingclub-grafana-data:

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB:-rowingclub}"
      POSTGRES_USER: "${POSTGRES_USER:-rowingclub}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunludur}"

    volumes:
      - rowingclub-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-rowingclub}" -d "${POSTGRES_DB:-rowingclub}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - rowingclub-network

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    volumes:
      - rowingclub-redis-data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - rowingclub-network

  # ---------------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped

    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - rowingclub-prometheus-data:/prometheus

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:9090/-/healthy || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s

    networks:
      - rowingclub-network

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD zorunludur}"
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - rowingclub-grafana-data:/var/lib/grafana

    depends_on:
      prometheus:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s

    networks:
      - rowingclub-network

  # ---------------------------------------------------------------------------
  # RowingClub API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile

    restart: unless-stopped

    environment:
      APP_ENV: "${APP_ENV:-Production}"
      ASPNETCORE_ENVIRONMENT: "${APP_ENV:-Production}"
      ASPNETCORE_URLS: "http://+:8080"

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-rowingclub}"
      POSTGRES_USER: "${POSTGRES_USER:-rowingclub}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

      # Uygulama tek connection string bekliyorsa bunu kullanın.
      CONNECTION_STRING: >-
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB:-rowingclub};
        Username=${POSTGRES_USER:-rowingclub};
        Password=${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_AUDIENCE: "${JWT_AUDIENCE}"
      JWT_SIGNING_PRIVATE_KEY: "${JWT_SIGNING_PRIVATE_KEY}"
      JWT_SIGNING_PUBLIC_KEY: "${JWT_SIGNING_PUBLIC_KEY}"

      FIELD_ENCRYPTION_KEY_CURRENT: "${FIELD_ENCRYPTION_KEY_CURRENT}"
      FIELD_ENCRYPTION_KEY_PREVIOUS: "${FIELD_ENCRYPTION_KEY_PREVIOUS}"
      FIELD_ENCRYPTION_KEY_VERSION: "${FIELD_ENCRYPTION_KEY_VERSION}"

      SMTP_HOST: "${SMTP_HOST}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"

      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"

    ports:
      - "${API_HTTP_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - rowingclub-network
