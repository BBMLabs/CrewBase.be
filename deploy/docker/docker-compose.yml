name: rowingclub

networks:
  rowingclub-network:
    driver: bridge

volumes:
  rowingclub-postgres-data:
  rowingclub-redis-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DATABASE_NAME}"
      POSTGRES_USER: "${POSTGRES_USERNAME}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    volumes:
      - rowingclub-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USERNAME}" -d "${POSTGRES_DATABASE_NAME}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - rowingclub-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"

    volumes:
      - rowingclub-redis-data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

    networks:
      - rowingclub-network

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile

    restart: unless-stopped

    environment:
      APP_ENV: "${APP_ENV:-Production}"
      ASPNETCORE_ENVIRONMENT: "${APP_ENV:-Production}"
      ASPNETCORE_URLS: "http://+:8080"

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE_NAME: "${POSTGRES_DATABASE_NAME}"
      POSTGRES_USERNAME: "${POSTGRES_USERNAME}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

      ConnectionStrings__DefaultConnection: >-
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DATABASE_NAME};
        Username=${POSTGRES_USERNAME};
        Password=${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: default
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_AUDIENCE: "${JWT_AUDIENCE}"
      JWT_SIGNING_PRIVATE_KEY: "${JWT_SIGNING_PRIVATE_KEY}"
      JWT_SIGNING_PUBLIC_KEY: "${JWT_SIGNING_PUBLIC_KEY}"

      FIELD_ENCRYPTION_KEY_CURRENT: "${FIELD_ENCRYPTION_KEY_CURRENT}"
      FIELD_ENCRYPTION_KEY_PREVIOUS: "${FIELD_ENCRYPTION_KEY_PREVIOUS}"
      FIELD_ENCRYPTION_KEY_VERSION: "${FIELD_ENCRYPTION_KEY_VERSION}"

      SMTP_HOST: "${SMTP_HOST}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"

      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - rowingclub-network
