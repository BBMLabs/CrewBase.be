name: rowingclub

networks:
  rowingclub-network:
    driver: bridge

services:
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile

    restart: unless-stopped

    env_file:
      - ${ENV_FILE:-../../.env.developer}

    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENV:-Production}"
      ASPNETCORE_URLS: "http://+:8080"

      # env_file's parser doesn't support the quoted multi-line PEM/key values these use, so those
      # keys never reach the container that way - only ${VAR} substitution (resolved by Compose
      # itself from the --env-file passed on the CLI, e.g. dev-up.sh's `--env-file .env.developer`)
      # correctly preserves the embedded newlines. This references the SAME variable names already
      # defined there - no secret value is duplicated into this tracked file.
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__SigningPrivateKeyPem: "${JWT_SIGNING_PRIVATE_KEY}"
      Jwt__SigningPublicKeyPem: "${JWT_SIGNING_PUBLIC_KEY}"

      FieldEncryption__CurrentKeyVersion: "${FIELD_ENCRYPTION_KEY_VERSION}"
      FieldEncryption__Keys__1: "${FIELD_ENCRYPTION_KEY_CURRENT}"
      FieldEncryption__BlindIndexKey: "${FIELD_ENCRYPTION_KEY_CURRENT}"

    expose:
      - "8080"

    networks:
      - rowingclub-network
